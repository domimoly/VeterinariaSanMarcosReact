# Nginx dentro del contenedor "web": publica React y reenvía /api/<servicio>/ al microservicio.
# 127.0.0.11 es el DNS interno de Docker; las variables evitan que Nginx falle al arrancar
# si un microservicio todavía no está disponible.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # /api/auth-service/auth/login  ->  ms-auth:8082/api/auth/login
  location /api/auth-service/ {
    set $destino http://ms-auth:8082;
    rewrite ^/api/auth-service/(.*)$ /api/$1 break;
    proxy_pass $destino;
    include /etc/nginx/conf.d/proxy-comun.inc;
  }

  location /api/servicios-service/ {
    set $destino http://ms-servicios:8083;
    rewrite ^/api/servicios-service/(.*)$ /api/$1 break;
    proxy_pass $destino;
    include /etc/nginx/conf.d/proxy-comun.inc;
  }

  location /api/mascotas-service/ {
    set $destino http://ms-mascotas:8084;
    rewrite ^/api/mascotas-service/(.*)$ /api/$1 break;
    proxy_pass $destino;
    include /etc/nginx/conf.d/proxy-comun.inc;
  }

  location /api/citas-service/ {
    set $destino http://ms-citas:8085;
    rewrite ^/api/citas-service/(.*)$ /api/$1 break;
    proxy_pass $destino;
    include /etc/nginx/conf.d/proxy-comun.inc;
  }

  location /api/fichas-service/ {
    set $destino http://ms-fichas:8086;
    rewrite ^/api/fichas-service/(.*)$ /api/$1 break;
    proxy_pass $destino;
    include /etc/nginx/conf.d/proxy-comun.inc;
  }

  # El movimiento de stock es solo entre servicios (ms-pedidos lo llama por la red interna de Docker)
  location = /api/productos-service/productos/stock {
    return 404;
  }

  location /api/productos-service/ {
    set $destino http://ms-productos:8087;
    rewrite ^/api/productos-service/(.*)$ /api/$1 break;
    proxy_pass $destino;
    include /etc/nginx/conf.d/proxy-comun.inc;
  }

  location /api/pedidos-service/ {
    set $destino http://ms-pedidos:8088;
    rewrite ^/api/pedidos-service/(.*)$ /api/$1 break;
    proxy_pass $destino;
    include /etc/nginx/conf.d/proxy-comun.inc;
  }

  # Archivos con hash en el nombre: se pueden guardar en caché mucho tiempo
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # React Router: cualquier otra ruta devuelve index.html (recargar /admin/usuarios no da 404)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
